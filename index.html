<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; media-src 'self'">
  <title>Lab 2 — Exercise 2: Reactive Task Manager</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      padding: 1rem;
      margin: 0;
      color: #1a1a1a;
      background: #fff;
    }

    .task-manager {
      max-width: 640px;
      margin: 0 auto;
    }

    .task-manager header {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .task-manager h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .task-manager input[type="text"] {
      flex: 1 1 200px;
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #333;
      border-radius: 4px;
    }

    .task-manager button {
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      border: 1px solid #333;
      background: #f5f5f5;
      border-radius: 4px;
    }

    .task-manager button:hover {
      background: #e5e5e5;
    }

    .task-manager button:focus-visible,
    .task-manager input:focus-visible {
      outline: 3px solid #005fcc;
      outline-offset: 2px;
    }

    .task-manager nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .task-manager nav button[aria-pressed="true"] {
      background: #005fcc;
      color: #fff;
      border-color: #005fcc;
    }

    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .task-list li {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .task-list li label {
      flex: 1;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      cursor: pointer;
    }

    .task-list li span {
      word-break: break-word;
    }

    [aria-live] {
      min-height: 1.5em;
      font-weight: 600;
      color: #0a6b0a;
    }
  </style>
</head>
<body>
  <h1>Reactive Task Manager</h1>

  <p id="status" aria-live="polite"></p>

  <main id="app" role="main"></main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
